services:
  # Service 1: the model is trained when this image is built (stage 1 of the dockerfile)
  # this container only copies the trained model and scaler into the shared volume
  model-training:
    build:
      context: .
      dockerfile: dockerfile
      target: model_training
    image: iris-trainer
    container_name: ml_trainer
    volumes:
      - model_exchange:/exchange   # Shared volume mount
    command: sh -c "cp my_model.keras scaler.pkl /exchange/ && echo 'Model copied to shared volume'"

  # Service 2: serves predictions, built from stage 2 of the same dockerfile
  serving:
    build:
      context: .
      dockerfile: dockerfile
      target: serving
    image: iris-app
    container_name: ml_serving
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MODEL_PATH=/exchange/my_model.keras
      - SCALER_PATH=/exchange/scaler.pkl
    volumes:
      - model_exchange:/exchange:ro   # read only, serving never changes the model
    depends_on:
      model-training:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  model_exchange: